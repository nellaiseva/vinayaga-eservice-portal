# =========================================================================
# TEST APPLICATION CONFIGURATION
# =========================================================================

# Database: Connect to local PostgreSQL test database or local dev instance
# Allows overriding via environment variables (e.g. CI/CD: SPRING_DATASOURCE_TEST_URL / SPRING_DATASOURCE_URL)
# with a fallback to local PostgreSQL on 127.0.0.1:5432
spring.datasource.url=${SPRING_DATASOURCE_TEST_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/eservice1}}
spring.datasource.username=${SPRING_DATASOURCE_TEST_USERNAME:${SPRING_DATASOURCE_USERNAME:eservice_app}}
spring.datasource.password=${SPRING_DATASOURCE_TEST_PASSWORD:${SPRING_DATASOURCE_PASSWORD:ikkase07}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline

# Test Secrets and Mock Configurations (No real credentials)
jwt.secret=${JWT_SECRET:test-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
file.max-size=${FILE_MAX_SIZE:30971520}

supabase.url=${SUPABASE_URL:https://example.supabase.co}
supabase.bucket=${SUPABASE_BUCKET:documents}
supabase.service-key=${SUPABASE_SERVICE_KEY:test-dummy-service-key}

msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com/api/v5/flow}
msg91.auth-key=${MSG91_AUTH_KEY:test-dummy-auth-key}
msg91.template-id=${MSG91_TEMPLATE_ID:test-template-id}
msg91.sender-id=${MSG91_SENDER_ID:NLIESE}
msg91.otp-variable=${MSG91_OTP_VARIABLE:number}

spring.main.lazy-initialization=true
owner.bootstrap.token=${OWNER_BOOTSTRAP_TOKEN:}
