# =========================================================================
# PRODUCTION PROFILE CONFIGURATION (spring.profiles.active=prod)
# =========================================================================
# Schema changes are strictly controlled by Flyway migrations.
# Hibernate schema modification is prohibited in production.
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline

# File Retention & Scheduled Cleanup Configuration
document.retention.days=30
document.cleanup.cron=0 0 2 * * *
