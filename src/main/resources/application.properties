spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline

# File Retention & Scheduled Cleanup Configuration
document.retention.days=30
document.cleanup.cron=0 0 2 * * *

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=${PORT:8080}
server.address=0.0.0.0

jwt.secret=${JWT_SECRET}

file.max-size=${FILE_MAX_SIZE:30971520}


msg91.base-url=${MSG91_BASE_URL}
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.template-id=${MSG91_TEMPLATE_ID}
msg91.sender-id=${MSG91_SENDER_ID}
msg91.otp-variable=${MSG91_OTP_VARIABLE}

spring.main.lazy-initialization=true
owner.bootstrap.token=${OWNER_BOOTSTRAP_TOKEN:}
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
