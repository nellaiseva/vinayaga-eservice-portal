

# ==========================================================
# DATABASE
# ==========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# ==========================================================
# SERVER
# ==========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# ==========================================================
# JWT
# ==========================================================

jwt.secret=${JWT_SECRET}


# ==========================================================
# FILE UPLOAD
# ==========================================================

file.max-size=${FILE_MAX_SIZE:30971520}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ==========================================================
# SUPABASE STORAGE
# ==========================================================

supabase.url=${SUPABASE_URL}
supabase.bucket=${SUPABASE_BUCKET}
supabase.service-key=${SUPABASE_SERVICE_KEY}


# ==========================================================
# MSG91
# ==========================================================

msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com/api/v5/flow}
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.template-id=${MSG91_TEMPLATE_ID}
msg91.sender-id=${MSG91_SENDER_ID}
msg91.otp-variable=${MSG91_OTP_VARIABLE:number}